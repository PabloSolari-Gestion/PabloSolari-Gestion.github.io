<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo Solari | Gestión Estratégica</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #cbd5e1 0%, #94a3b8 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 15px 0;
            position: relative;
        }

        /* Foto de fondo vinculada al nombre exacto de tu GitHub */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('Foto%20Perfil.png'); /* Respeta tus mayúsculas y espacio */
            background-size: cover;
            background-position: center 15%;
            opacity: 0.28; /* Subido para que tu rostro tenga más presencia */
            z-index: -1;
        }

        header { 
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .header-titles h1 { font-size: 2.6rem; font-weight: 700; color: #0f172a; line-height: 1; }
        .header-titles p { font-size: 0.65rem; letter-spacing: 2px; color: #475569; font-weight: 700; text-transform: uppercase; margin-top: 5px; }
        
        .btn-whatsapp {
            background: #16a34a;
            color: white;
            padding: 10px 22px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.85rem;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
        }

        .clients-banner {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            padding: 8px 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid rgba(15, 23, 42, 0.1);
        }
        .clients-label { font-size: 0.65rem; font-weight: 700; color: #1e293b; text-transform: uppercase; margin-bottom: 4px; }
        .clients-list { font-size: 0.9rem; color: #334155; font-weight: 500; }

        .hero { text-align: center; margin-bottom: 25px; padding: 0 20px; }
        .hero h2 { font-size: 2.3rem; color: #0f172a; font-weight: 700; }
        .hero h2 span { color: #2563eb; }

        .main-layout {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1.3fr 0.8fr 1fr;
            gap: 18px;
            padding: 0 20px;
        }

        .card {
            background: rgba(255, 255, 255, 0.85); /* Traslúcido para integrar el fondo */
            backdrop-filter: blur(8px); /* Efecto esmerilado elegante */
            border-radius: 24px;
            padding: 22px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .video-container {
            border-radius: 16px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            margin-bottom: 12px;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .ejes-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            height: 100%;
            justify-content: center;
        }
        .eje-item {
            background: rgba(248, 250, 252, 0.7);
            padding: 12px 14px;
            border-radius: 12px;
            border-left: 5px solid #2563eb;
        }
        .eje-title { font-size: 0.85rem; font-weight: 700; color: #0f172a; margin-bottom: 2px; }
        .eje-desc { font-size: 0.7rem; color: #64748b; line-height: 1.3; }

        .bi-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 5px;
        }
        .bi-stack img {
            width: 100%;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            height: 100px;
            object-fit: cover;
        }

        .impact-footer {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 18px;
            padding: 30px 20px;
        }
        .impact-box {
            background: rgba(255, 255, 255, 0.55);
            backdrop-filter: blur(6px);
            padding: 18px;
            border-radius: 20px;
            text-align: center;
            border-bottom: 4px solid #2563eb;
        }
        .impact-box h4 { font-size: 1.05rem; color: #0f172a; margin-bottom: 6px; }
        .impact-box p { font-size: 0.8rem; color: #475569; line-height: 1.4; }

        @media (max-width: 950px) {
            .main-layout { grid-template-columns: 1fr; }
            .impact-footer { grid-template-columns: 1fr; }
            .header-titles h1 { font-size: 2.1rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-titles">
            <h1>Pablo Solari</h1>
            <p>Estrategia • Negocios • Gestión</p
