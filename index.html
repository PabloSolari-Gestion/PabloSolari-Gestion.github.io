<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo Solari | Estrategia & Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            /* Fondo intermedio con más carácter */
            background: linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            color: #1e293b;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow-x: hidden;
        }

        header { 
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
        }

        .header-titles h1 { font-size: 1.8rem; font-weight: 700; color: #0f172a; }
        .header-titles p { font-size: 0.7rem; letter-spacing: 2px; color: #475569; font-weight: 700; text-transform: uppercase; }
        
        .btn-header {
            background: #16a34a;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s ease;
            box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);
        }
        .btn-header:hover { background: #15803d; transform: scale(1.02); }

        .clients-banner {
            width: 100%;
            max-width: 1200px;
            padding: 5px 20px;
            text-align: center;
            margin-bottom: 5px;
        }
        .clients-banner span { font-size: 0.7rem; color: #64748b; text-transform: uppercase; letter-spacing: 1px; margin-right: 10px; }
        .clients-list { font-weight: 700; font-size: 0.9rem; color: #334155; display: inline-block; }

        .hero { text-align: center; margin: 10px 0 20px 0; }
        .hero h2 { font-size: clamp(2rem, 5vw, 3.2rem); color: #0f172a; font-weight: 700; line-height: 1.1; }
        .hero h2 span { color: #2563eb; }

        .main-layout {
            max-width: 1200px;
            width: 100%;
            display: grid;
            /* Video con más lugar (1.4fr) */
            grid-template-columns: 1.4fr 1fr; 
            gap: 25px;
            padding: 0 20px;
        }

        .bento-item {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 24px;
            padding: 30px;
            border: 1px solid #cbd5e1;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-wrapper {
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            background: #000;
            aspect-ratio: 16/9;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .services-list {
            display: grid;
            grid-template-columns: 1fr;
            gap: 12px;
            margin: 20px 0;
        }
        .service-tag {
            background: #f1f5f9;
            padding: 14px 18px;
            border-radius: 12px;
            border-left: 6px solid #2563eb;
            font-size: 0.95rem;
            color: #1e293b;
            font-weight: 700;
        }

        .preview-dashboards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            filter: blur(5px);
            opacity: 0.6;
            transition: 0.5s ease;
        }
        .services-container:hover .preview-dashboards { filter: blur(0); opacity: 1; }
        .preview-dashboards img { width: 100%; border-radius: 10px; max-height: 120px; object-fit: cover; background: white; }

        .impact-section {
            max-width: 1200px;
            width: 100%;
            margin-top: 30px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 0 20px 30px 20px;
        }
        .impact-card {
            background: rgba(255,255,255,0.8);
            padding: 20px;
            border-radius: 18px;
            text-align: center;
            border-bottom: 5px solid #2563eb;
        }
        .impact-card h4 { font-size: 1.2rem; color: #0f172a; margin-bottom: 6px; font-weight: 700; }
