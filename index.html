<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo Solari | Estrategia & Gestión</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #d1d9e6 0%, #aab7c4 100%);
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Evita el scroll global */
            padding-bottom: 10px;
        }

        header { 
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .header-titles h1 { font-size: 1.5rem; font-weight: 700; color: #0f172a; }
        .header-titles p { font-size: 0.6rem; letter-spacing: 1.5px; color: #475569; font-weight: 700; text-transform: uppercase; }
        
        .btn-header {
            background: #16a34a;
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .clients-section {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            padding: 5px 20px;
            margin-bottom: 10px;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .clients-label { font-size: 0.65rem; font-weight: 700; color: #1e293b; text-transform: uppercase; margin-bottom: 2px; }
        .clients-list { font-size: 0.8rem; color: #475569; }

        .hero { text-align: center; margin-bottom: 15px; }
        .hero h2 { font-size: 2.2rem; color: #0f172a; font-weight: 700; }
        .hero h2 span { color: #2563eb; }

        .main-layout {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 15px;
            padding: 0 20px;
            flex: 1; /* Ocupa el espacio disponible */
        }

        .bento-item {
            background: rgba(255, 255, 255, 0.92);
            border-radius: 18px;
            padding: 15px 20px;
            border: 1px solid rgba(255,255,255,0.5);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-wrapper {
            border-radius: 10px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            max-width: 380px;
            margin: 0 auto 10px auto;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        .topics-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin: 10px 0;
        }
        .topic-tag {
            background: #f1f5f9;
            padding: 8px;
            border-radius: 8px;
            border-left: 3px solid #2563eb;
            font-size: 0.75rem;
            color: #1e293b;
            font-weight: 700;
            text-align: center;
        }

        .preview-dashboards {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 5px;
            filter: blur(2px);
            opacity: 0.6;
        }
        .preview-dashboards img { width: 100%; border-radius: 6px; max-height: 80px; object-fit: cover; }

        .impact-section {
            max-width: 1100px;
            width: 100%;
            margin-top: 15px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            padding: 0 20px;
        }
        .impact-card {
            background: rgba(255,255,255,0.6);
            padding: 10px;
            border-radius: 12px;
            text-align: center;
            border-bottom: 3px solid #2563eb;
        }
        .impact-card h4 { font-size: 0.85rem; color: #0f172a; margin-bottom: 2px; }
        .impact-card p { font-size: 0.7rem; color: #475569; line-height: 1.2; }

        @media (max-width: 850px) {
            body { overflow-y: auto; height: auto; }
            .main-layout, .impact-section { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <header>
        <div class="header-titles">
            <h1>Pablo Solari</h1>
            <p>GESTIÓN ESTRATÉGICA DE NEGOCIOS</p>
        </div>
        <a href="https://wa.me/5493512589176" class="btn-header">Consultar →</a>
    </header>

    <div class="clients-section">
        <div class="clients-label">Casos de Éxito & Clientes:</div>
        <div class="clients-list">Arcor • Abea Neumáticos • Monarca Granollas • Footwork Lab</div>
    </div>

    <div class="hero">
        <h2>Tome el control de su <span>
