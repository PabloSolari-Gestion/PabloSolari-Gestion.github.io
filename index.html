<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pablo Solari | Gestión Estratégica</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Outfit', sans-serif;
            /* FONDO: El tono intermedio exacto de la imagen */
            background: radial-gradient(circle at center, #e2e8f0 0%, #cbd5e1 100%);
            color: #1e293b;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden; /* Evita que aparezca la barra lateral */
            padding: 10px 0;
        }

        header { 
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
        }

        .header-titles h1 { font-size: 1.5rem; color: #0f172a; }
        .header-titles p { font-size: 0.6rem; letter-spacing: 1.5px; color: #475569; text-transform: uppercase; font-weight: 700; }
        
        .btn-header {
            background: #16a34a;
            color: white;
            padding: 10px 18px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.8rem;
        }

        .clients-bar {
            width: 100%;
            max-width: 1100px;
            text-align: center;
            padding: 8px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            margin-bottom: 15px;
        }
        .clients-label { font-size: 0.65rem; font-weight: 700; color: #1e293b; text-transform: uppercase; }
        .clients-list { font-size: 0.85rem; color: #475569; font-weight: 500; margin-top: 2px; }

        .hero h2 { font-size: 2.2rem; color: #0f172a; margin-bottom: 15px; text-align: center; }
        .hero h2 span { color: #2563eb; }

        /* CONTENEDOR BENTO PRINCIPAL */
        .main-container {
            max-width: 1100px;
            width: 100%;
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 20px;
            padding: 0 20px;
            flex: 1; /* Esto hace que use el espacio central sin empujar lo de abajo */
            min-height: 0;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: 0 10px 20px rgba(0,0,0,0.03);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .video-box {
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            aspect-ratio: 16/9;
            width: 100%;
            max-width: 400px;
            margin: 0 auto 12px auto;
        }
        video { width: 100%; height: 100%; object-fit: cover; }

        /* GRID DE 4 TOPICOS */
        .topics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin: 15px 0;
        }
        .topic-item {
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            border-left: 4px solid #2563eb;
            font-size: 0.8rem;
